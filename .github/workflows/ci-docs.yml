name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: docs structure and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check required docs and forbidden data
        run: python3 scripts/check_structure.py
      - name: Check relative links and anchors
        run: python3 scripts/check_links.py

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
