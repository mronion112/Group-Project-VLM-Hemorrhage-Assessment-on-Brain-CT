name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: schemas, artifacts and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Validate documented contract examples
        run: python3 scripts/validate_contract.py
      - name: Validate submitted case artifacts
        run: python3 scripts/check_case_artifacts.py --cases-root contract-cases
      - name: Check the reference case artifacts
        run: python3 scripts/check_case_artifacts.py --case-dir tests/contract/fixtures/case-ok
      - name: Run tests
        run: python3 -m pytest tests -q
      - name: Lint scripts and tests
        run: ruff check scripts tests
